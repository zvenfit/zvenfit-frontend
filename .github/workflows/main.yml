name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-environment.yml
    with:
      deployment_environment: production
      site_url: https://zvenfit.ru
      s3_bucket: zvenfit-frontend
      lead_function_name: zvenfit-telegram-lead
      schedule_function_name: zvenfit-fitbase-schedule
      traffic_function_name: zvenfit-site-traffic
      lead_retry_trigger_name: zvenfit-lead-telegram-retry
      ydb_database_name: zvenfit-leads
      allowed_origins: https://zvenfit.ru,https://www.zvenfit.ru,https://zvenigorod.zvenfit.ru
      site_access_mode: public
      gateway_name: disabled
      authorizer_function_name: disabled
    secrets:
      FITBASE_API_TOKEN: ${{ secrets.FITBASE_API_TOKEN }}
      LEAD_RATE_LIMIT_SECRET: ${{ secrets.LEAD_RATE_LIMIT_SECRET }}
      MONIUM_API_KEY: ${{ secrets.MONIUM_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  release:
    name: Publish production release
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout deployed commit and version tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Publish tag and release for the verified deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/publish-production-release.cjs
