name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_staging:
        description: 'Emergency only: deploy production without staging and E2E'
        type: boolean
        default: false
      reason:
        description: 'Why staging is skipped (required with skip_staging)'
        type: string
        default: ''

# Deploys never interrupt each other: a cancelled rollout could leave production
# half-updated. While one run is in progress GitHub keeps only the newest waiting
# run, so intermediate commits are released together with the latest one.
# staging.yml shares this group because both workflows deploy staging.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  release-path:
    name: Select release path
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require main and a reason for an emergency release
        env:
          EMERGENCY: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_staging }}
          REASON: ${{ inputs.reason }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases run only from main"
            exit 1
          fi
          if [ "$EMERGENCY" != "true" ]; then
            echo "Release path: staging, E2E, then production." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$(printf '%s' "$REASON" | tr -d '[:space:]')" ]; then
            echo "::error::An emergency release without staging requires a reason"
            exit 1
          fi
          {
            echo "### Emergency release without staging and E2E"
            echo
            printf 'Reason: %s\n' "$REASON"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Production is deployed without staging and E2E; the reason is in the run summary"

  staging:
    name: Staging
    needs: release-path
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_staging) }}
    uses: ./.github/workflows/_deploy-environment.yml
    with:
      deployment_environment: staging
      site_url: https://staging.zvenfit.ru
      s3_bucket: zvenfit-frontend-staging
      lead_function_name: zvenfit-telegram-lead-staging
      schedule_function_name: zvenfit-fitbase-schedule-staging
      traffic_function_name: zvenfit-site-traffic-staging
      lead_retry_trigger_name: zvenfit-lead-telegram-retry-staging
      ydb_database_name: zvenfit-leads-staging
      allowed_origins: https://staging.zvenfit.ru
      site_access_mode: authenticated-gateway
      gateway_name: zvenfit-staging
      authorizer_function_name: zvenfit-staging-authorizer
    secrets:
      LEAD_RATE_LIMIT_SECRET: ${{ secrets.LEAD_RATE_LIMIT_SECRET }}
      STAGING_BASIC_AUTH_USERNAME: ${{ secrets.STAGING_BASIC_AUTH_USERNAME }}
      STAGING_BASIC_AUTH_PASSWORD: ${{ secrets.STAGING_BASIC_AUTH_PASSWORD }}

  e2e:
    name: Staging E2E
    needs: staging
    permissions:
      contents: read
    uses: zvenfit/zvenfit-autotests/.github/workflows/staging-smoke.yml@52b6975bc4e504111bda7dd543163930b1ba196c
    with:
      autotests_ref: 52b6975bc4e504111bda7dd543163930b1ba196c
    secrets:
      STAGING_BASIC_AUTH_USERNAME: ${{ secrets.STAGING_BASIC_AUTH_USERNAME }}
      STAGING_BASIC_AUTH_PASSWORD: ${{ secrets.STAGING_BASIC_AUTH_PASSWORD }}

  production:
    name: Production
    needs: [release-path, e2e]
    # Skipped staging jobs would skip this job by default, so the gate is explicit:
    # a green E2E run, or an emergency dispatch whose reason passed release-path.
    if: >-
      ${{ !cancelled() && needs.release-path.result == 'success' &&
      (needs.e2e.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_staging)) }}
    uses: ./.github/workflows/_deploy-environment.yml
    with:
      deployment_environment: production
      site_url: https://zvenfit.ru
      s3_bucket: zvenfit-frontend
      lead_function_name: zvenfit-telegram-lead
      schedule_function_name: zvenfit-fitbase-schedule
      traffic_function_name: zvenfit-site-traffic
      lead_retry_trigger_name: zvenfit-lead-telegram-retry
      ydb_database_name: zvenfit-leads
      allowed_origins: https://zvenfit.ru,https://www.zvenfit.ru,https://zvenigorod.zvenfit.ru
      site_access_mode: public
      gateway_name: disabled
      authorizer_function_name: disabled
    secrets:
      FITBASE_API_TOKEN: ${{ secrets.FITBASE_API_TOKEN }}
      LEAD_RATE_LIMIT_SECRET: ${{ secrets.LEAD_RATE_LIMIT_SECRET }}
      MONIUM_API_KEY: ${{ secrets.MONIUM_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  release:
    name: Publish production release
    needs: production
    # Explicit result check: after an emergency release the skipped staging jobs
    # would otherwise skip publication even though production succeeded.
    if: ${{ !cancelled() && needs.production.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout deployed commit and version tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Publish tag and release for the verified deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/publish-production-release.cjs
