name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  S3_BUCKET: 'zvenfit-frontend'
  FUNCTION_NAME: 'zvenfit-telegram-lead'
  SCHEDULE_FUNCTION_NAME: 'zvenfit-fitbase-schedule'
  YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
  ALLOWED_ORIGINS: 'https://zvenfit.ru,https://www.zvenfit.ru,https://zvenigorod.zvenfit.ru'
  LOG_LEVEL: 'info'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/lead-intake/package-lock.json
            functions/fitbase-schedule/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions/lead-intake
          npm ci --prefix functions/fitbase-schedule

      - name: Run linters
        run: |
          npm run lint
          npm run lint:public

      - name: Run tests
        run: |
          npm run test:lead-fn
          npm run test:schedule-fn
          npm run test:lead-import

      - name: Verify static production build
        env:
          LEAD_API_URL: https://example.invalid/lead
          SCHEDULE_API_URL: https://example.invalid/schedule
          ASSET_VERSION: ci-${{ github.run_number }}
        run: npm run test:build

  deploy-function:
    needs: quality-checks
    runs-on: ubuntu-latest
    outputs:
      function_url: ${{ steps.get-url.outputs.url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install lead function dependencies
        run: npm ci --prefix functions/lead-intake

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Authenticate with service account
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_JSON_KEY }}
        run: |
          echo "$YC_SA_KEY" > /tmp/sa-key.json
          yc config profile create ci-profile
          yc config set service-account-key /tmp/sa-key.json
          yc config set folder-id ${{ env.YC_FOLDER_ID }}
          rm /tmp/sa-key.json

      - name: Deploy Cloud Function
        env:
          NODE_ENV: production
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LEAD_RATE_LIMIT_SECRET: ${{ secrets.LEAD_RATE_LIMIT_SECRET }}
          ALLOWED_ORIGINS: ${{ env.ALLOWED_ORIGINS }}
          YC_LEAD_SERVICE_ACCOUNT_ID: ${{ vars.YC_LEAD_SERVICE_ACCOUNT_ID }}
          YC_LEAD_TIMEOUT: ${{ vars.YC_LEAD_TIMEOUT || '120s' }}
          YDB_DATABASE_NAME: ${{ vars.YDB_DATABASE_NAME || 'zvenfit-leads' }}
          YDB_LEADS_TABLE: ${{ vars.YDB_LEADS_TABLE || 'leads' }}
          YDB_RATE_LIMITS_TABLE: ${{ vars.YDB_RATE_LIMITS_TABLE || 'lead_rate_limits' }}
          LEAD_RATE_LIMIT_MAX: ${{ vars.LEAD_RATE_LIMIT_MAX || '5' }}
          LEAD_RATE_LIMIT_WINDOW_SECONDS: ${{ vars.LEAD_RATE_LIMIT_WINDOW_SECONDS || '600' }}
          MAX_TELEGRAM_ATTEMPTS: ${{ vars.MAX_TELEGRAM_ATTEMPTS || '12' }}
          TELEGRAM_RETRY_BATCH_SIZE: ${{ vars.TELEGRAM_RETRY_BATCH_SIZE || '5' }}
          TELEGRAM_TIMEOUT_MS: ${{ vars.TELEGRAM_TIMEOUT_MS || '15000' }}
          YDB_QUERY_TIMEOUT_MS: ${{ vars.YDB_QUERY_TIMEOUT_MS || '5000' }}
          YDB_SLOW_OPERATION_MS: ${{ vars.YDB_SLOW_OPERATION_MS || '1000' }}
          YDB_SESSION_POOL_SIZE: ${{ vars.YDB_SESSION_POOL_SIZE || '5' }}
          MONIUM_METRICS_ENABLED: 'true'
          MONIUM_PROJECT: folder__${{ secrets.YC_FOLDER_ID }}
          MONIUM_CLUSTER: 'default'
          MONIUM_SERVICE: 'zvenfit-frontend'
          MONIUM_METRICS_TIMEOUT_MS: '1000'
          LOG_LEVEL: ${{ env.LOG_LEVEL }}
        run: bash scripts/deploy-lead-intake.sh

      - name: Get function URL
        id: get-url
        run: |
          URL=$(yc serverless function get --name="${FUNCTION_NAME}" --format=json | jq -r '.http_invoke_url // empty')
          if [ -z "$URL" ]; then
            echo "ERROR: Failed to get function URL" >&2
            exit 1
          fi
          echo "url=${URL}" >> $GITHUB_OUTPUT
          echo "Function URL: ${URL}"

  deploy-schedule-function:
    needs: quality-checks
    runs-on: ubuntu-latest
    outputs:
      function_url: ${{ steps.get-schedule-url.outputs.url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install schedule function dependencies
        run: npm ci --prefix functions/fitbase-schedule

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Authenticate with service account
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_JSON_KEY }}
        run: |
          echo "$YC_SA_KEY" > /tmp/sa-key.json
          yc config profile create ci-profile-schedule
          yc config set service-account-key /tmp/sa-key.json
          yc config set folder-id ${{ env.YC_FOLDER_ID }}
          rm /tmp/sa-key.json

      - name: Deploy schedule Cloud Function
        env:
          NODE_ENV: production
          FITBASE_API_TOKEN: ${{ secrets.FITBASE_API_TOKEN }}
          FITBASE_DOMAIN: zvenfit
          FITBASE_CLUB_ID: ${{ vars.FITBASE_CLUB_ID }}
          ALLOWED_ORIGINS: ${{ env.ALLOWED_ORIGINS }}
          LOG_LEVEL: ${{ env.LOG_LEVEL }}
        run: bash scripts/deploy-fitbase-schedule.sh

      - name: Get schedule function URL
        id: get-schedule-url
        run: |
          URL=$(yc serverless function get --name="${SCHEDULE_FUNCTION_NAME}" --format=json | jq -r '.http_invoke_url // empty')
          if [ -z "$URL" ]; then
            echo "ERROR: Failed to get schedule function URL" >&2
            exit 1
          fi
          echo "url=${URL}" >> $GITHUB_OUTPUT
          echo "Schedule function URL: ${URL}"

  deploy-site:
    runs-on: ubuntu-latest
    needs: [deploy-function, deploy-schedule-function]
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        env:
          LEAD_API_URL: ${{ needs.deploy-function.outputs.function_url }}
          SCHEDULE_API_URL: ${{ needs.deploy-schedule-function.outputs.function_url }}
          Y_MAPS_API_KEY: ${{ vars.Y_MAPS_API_KEY }}
          ASSET_VERSION: ${{ vars.ASSET_VERSION || github.run_number }}
        run: |
          if [ -z "$LEAD_API_URL" ]; then
            echo "ERROR: LEAD_API_URL is empty — deploy-function job output was not passed" >&2
            exit 1
          fi
          if [ -z "$SCHEDULE_API_URL" ]; then
            echo "ERROR: SCHEDULE_API_URL is empty — deploy-schedule-function job output was not passed" >&2
            exit 1
          fi
          echo "Building with LEAD_API_URL: $LEAD_API_URL"
          echo "Building with SCHEDULE_API_URL: $SCHEDULE_API_URL"
          echo "Building with ASSET_VERSION: $ASSET_VERSION"
          npm run build || exit 1

      - name: Upload immutable assets to Yandex Object Storage
        uses: docker://amazon/aws-cli:2.25.1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_REGION: ru-1
          AWS_ENDPOINT_URL: https://storage.yandexcloud.net
        with:
          args: >
            s3 sync ./dist s3://${{ env.S3_BUCKET }}
            --delete
            --exclude "*.html"
            --exclude "robots.txt"
            --exclude "sitemap.xml"
            --cache-control "public, max-age=31536000, immutable"
            --metadata-directive REPLACE

      - name: Upload crawl metadata (no-cache)
        uses: docker://amazon/aws-cli:2.25.1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_REGION: ru-1
          AWS_ENDPOINT_URL: https://storage.yandexcloud.net
        with:
          args: >
            s3 sync ./dist s3://${{ env.S3_BUCKET }}
            --delete
            --exclude "*"
            --include "robots.txt"
            --include "sitemap.xml"
            --cache-control "no-cache, must-revalidate"
            --metadata-directive REPLACE

      - name: Upload HTML (no-cache)
        uses: docker://amazon/aws-cli:2.25.1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_REGION: ru-1
          AWS_ENDPOINT_URL: https://storage.yandexcloud.net
        with:
          args: >
            s3 sync ./dist s3://${{ env.S3_BUCKET }}
            --delete
            --exclude "*"
            --include "*.html"
            --cache-control "no-cache, must-revalidate"
            --metadata-directive REPLACE
