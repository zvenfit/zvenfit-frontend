name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-environment.yml
    with:
      deployment_environment: production
      site_url: https://zvenfit.ru
      s3_bucket: zvenfit-frontend
      lead_function_name: zvenfit-telegram-lead
      schedule_function_name: zvenfit-fitbase-schedule
      traffic_function_name: zvenfit-site-traffic
      lead_retry_trigger_name: zvenfit-lead-telegram-retry
      ydb_database_name: zvenfit-leads
      allowed_origins: https://zvenfit.ru,https://www.zvenfit.ru,https://zvenigorod.zvenfit.ru
      site_access_mode: public
      gateway_name: disabled
      authorizer_function_name: disabled
    secrets:
      FITBASE_API_TOKEN: ${{ secrets.FITBASE_API_TOKEN }}
      LEAD_RATE_LIMIT_SECRET: ${{ secrets.LEAD_RATE_LIMIT_SECRET }}
      MONIUM_API_KEY: ${{ secrets.MONIUM_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
